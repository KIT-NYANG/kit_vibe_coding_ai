[project]
name = "kit-vibe-coding-ai"
version = "0.1.0"
description = "AI server for STT, transcript analysis, quiz generation"
authors = [
    { name = "TP9NS", email = "pshccxx@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "faster-whisper>=1.1.0,<2.0.0",
    "langgraph (>=1.1.6,<2.0.0)",
    "langchain-groq (>=1.1.2,<2.0.0)",
    "langchain-core (>=1.2.27,<2.0.0)",
    "langchain-openai (>=1.1.12,<2.0.0)",
    "openai (>=2.31.0,<3.0.0)"
]

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
httpx = "^0.28.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"